version: 2

project_name: devbase

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/devbase
    binary: devbase
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt

release:
  footer: |
    Verify integrity with `checksums.txt` (SHA-256).
