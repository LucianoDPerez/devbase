name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install semgrep
      - run: go generate ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      # Semgrep installed above: gate fixtures assert real PASS, not SKIP.
      - run: go test ./...

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install semgrep
      - run: go generate ./...
      - run: bash scripts/e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-e2e
          path: .devbase/evidence-e2e/

  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install semgrep
      - run: semgrep scan --config auto --severity ERROR --error

  smoke-install-sh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: DEVBIN=$RUNNER_TEMP/bin bash -c 'curl -fsSL https://raw.githubusercontent.com/LucianoDPerez/devbase/main/install.sh | bash'
      - run: $RUNNER_TEMP/bin/devbase doctor

  smoke-install-ps1:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - run: |
          $env:DEVBIN = "$env:RUNNER_TEMP\bin"
          irm https://raw.githubusercontent.com/LucianoDPerez/devbase/main/install.ps1 | iex
        shell: powershell
      - run: '& "$env:RUNNER_TEMP\bin\devbase.exe" doctor'
        shell: powershell
